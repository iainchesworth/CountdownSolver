name: CI

# The pull request gate. A pull request (a draft too) runs the static checks. A ready pull
# request, a merge-queue entry and a push also build, unless the plan finds that nothing a
# build reads has changed.
#
# Two status checks are required: "CI Status", which aggregates the jobs below, and
# "Scan dependency diff" (dependency-review.yml). A check from a called workflow carries the
# caller's job name as a prefix, so it cannot be required by its plain name.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Runs every leg on the chosen branch (`gh workflow run ci.yml --ref <branch>`).
  workflow_dispatch:

# Cancel a superseded pull request run; a push or a queue entry runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    permissions:
      contents: read
      pull-requests: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/policy.yml@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

  zizmor:
    name: Workflow analysis
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/zizmor.yml@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the shared scripts
        uses: iainchesworthlabs/icl-common-infra/actions/checkout-infra@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      - name: Check the vendored CMake modules
        run: python3 tools/ci/sync_cmake.py --check --infra .icl-infra

      - name: Decide scope
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            git diff --name-only "$BASE_SHA"...HEAD | python3 .icl-infra/scripts/plan_gate.py --config .github/ci/plan.json >> "$GITHUB_OUTPUT"
          else
            python3 .icl-infra/scripts/plan_gate.py --config .github/ci/plan.json --force-all >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ${{ matrix.os }}
    # Jobs flagged experimental (macOS/libc++) may fail without failing the run.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Toolchain floor: GCC 16, Clang 23, MSVC 14.51, AppleClang 17 (the
          # versions are pinned in .github/toolchain-versions.json). Anything
          # older lacks the C++23 features used here (deducing this,
          # views::enumerate / stride / zip, ranges::to, std::expected).
          - name: Linux (GCC 16)
            os: ubuntu-26.04
            preset: linux-gcc-debug
            cxx: g++-16
          - name: Linux (Clang 23)
            os: ubuntu-26.04
            preset: linux-clang-debug
            cxx: clang++-23
            # Use libstdc++ (from GCC 16): libc++ does not yet implement
            # views::enumerate / views::stride.
          - name: macOS (AppleClang)
            os: macos-26
            preset: macos-clang-debug
            # macOS uses libc++, which still lacks views::enumerate / stride;
            # countdown/detail/ranges_compat.hpp provides fallbacks so it builds.
          - name: Windows (MSVC)
            os: windows-2025-vs2026
            preset: windows-msvc-debug

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      # Ahead of CMake: the Visual Studio environment puts its own tools on
      # PATH, and the CMake 4 below has to come after it.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: iainchesworthlabs/icl-common-infra/actions/setup-msvc-env@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      # The GitHub runners ship CMake 3.x; the project (and CMakePresets)
      # require CMake 4. get-cmake installs a matching CMake 4 and Ninja on
      # every OS.
      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: "4.3.4"
          ninjaVersion: "1.13.2"

      # GCC 16 provides libstdc++ 16 for both the GCC job and (as the standard
      # library) the Clang job, so it is installed on both and only the GCC job
      # makes it the compiler.
      - name: Install GCC 16 (Linux)
        if: runner.os == 'Linux'
        uses: iainchesworthlabs/icl-common-infra/actions/setup-gcc@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          export-compiler: ${{ startsWith(matrix.cxx, 'g++') }}

      - name: Install Clang 23 (Linux Clang)
        if: startsWith(matrix.cxx, 'clang++')
        uses: iainchesworthlabs/icl-common-infra/actions/setup-llvm@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      # Prebuilt Qt (official binaries) so the GUI app builds without compiling
      # Qt from source. Sets QT_ROOT_DIR for find_package(Qt6). The version and
      # the Windows aqtinstall source come from .github/toolchain-versions.json.
      - name: Install Qt (prebuilt)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      # Builds the library, tests AND the Qt app (COUNTDOWN_BUILD_APP defaults
      # ON); vcpkg supplies only Catch2, Qt comes from the prebuilt install.
      # Matrix values are routed through env: rather than expanded directly
      # into the run: script -- the shell sees them as plain variables
      # instead of literal template-substituted text, which is the
      # recommended way to avoid a code-injection-shaped script (even though
      # these particular values come from this workflow's own matrix, not
      # attacker-controlled event input). shell: bash keeps $VAR syntax
      # working the same way on the Windows runner too (default there is
      # pwsh, where plain $VAR means something else).
      - name: Configure
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          EXTRA_CXX_COMPILER: ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}
          EXTRA_CXX_FLAGS: ${{ matrix.cxxflags && format('-DCMAKE_CXX_FLAGS={0}', matrix.cxxflags) || '' }}
        run: >
          cmake --preset "$CMAKE_PRESET"
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          $EXTRA_CXX_COMPILER
          $EXTRA_CXX_FLAGS

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Re-runs lupdate (via the update_translations target qt_add_translations
      # generates - see src/app/CMakeLists.txt) against the same sources it
      # scans at release time, then checks the regenerated .ts files for any
      # <translation type="unfinished"> - lupdate's marker for a <source>
      # string that's new, changed, or was never actually translated. Only
      # runs once (this matrix leg) since it doesn't depend on OS/compiler.
      # Companion to the 'Translations complete' job below, which checks the
      # same marker on the committed files without rebuilding - this one
      # additionally catches a UI string that changed/was added but lupdate
      # was never re-run to reflect it in src/app/translations.
      - name: Check translations are up to date
        if: matrix.name == 'Linux (GCC 16)'
        shell: bash
        run: |
          cmake --build --preset ${{ matrix.preset }} --target update_translations
          if grep -rl 'type="unfinished"' src/app/translations/*.ts; then
            echo "::error::lupdate found UI text with no finished translation in the file(s) listed above. Translate/review the new or changed <source> entries in src/app/translations and remove type=\"unfinished\" from their <translation> tag." >&2
            exit 1
          fi

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Save the vcpkg caches
        if: always()
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/save-vcpkg-cache@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

  translations:
    name: Translations complete
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fast, build-free companion to 'Check translations are up to date'
      # above: every <translation> in src/app/translations/*.ts must be
      # reviewed and marked finished (no type="unfinished" attribute) before
      # it ships. Catches a hand-edited .ts file left unreviewed even when
      # nothing in the QML/C++ sources changed.
      - name: Check for unreviewed/untranslated strings
        run: |
          if grep -rn 'type="unfinished"' src/app/translations/*.ts; then
            echo "::error::Found translation(s) marked unfinished (listed above). Translate/review them and remove type=\"unfinished\" from the <translation> tag before merging." >&2
            exit 1
          fi
          echo "All translations reviewed and finished."

  toolchain-pins:
    name: Toolchain pins
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every toolchain version in the workflows and install scripts must equal
      # .github/toolchain-versions.json.
      - name: Check toolchain versions
        run: python3 tools/ci/check_toolchain_versions.py

      # The release preflight and the identifier check have tests of their own.
      - name: Test the CI tools
        run: python3 -I -m unittest discover -s tools/ci -p 'test_*.py'

  android-build:
    name: Android (arm64-v8a, build-only)
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # androiddeployqt's generated Gradle project needs a JDK.
      - name: Install JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # Installs the Android SDK cmdline-tools/platform-tools and sets
      # ANDROID_HOME/ANDROID_SDK_ROOT; the NDK itself is a separate
      # sdkmanager install below (the one Qt 6.12's Android kit is built with -
      # see docs/ci.md).
      # >= v4.0.2: v4.0.1's default `packages: tools platform-tools` asks
      # sdkmanager for the long-removed `tools` package ("Warning: Failed to
      # find package 'tools'", exit code 1), which fails this step on the
      # current runner image. v4.0.2 dropped it from the default.
      - name: Install Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # The platform and build-tools are the ones the standard names for a
      # store build (.github/toolchain-versions.json, android.*).
      - name: Install Android NDK, platform and build-tools
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # Two Qt kits: a desktop one for QT_HOST_PATH (cross-build host tools -
      # moc, qmlcachegen, ...) and the Android one actually targeted.
      # Both installs set the same QT_ROOT_DIR env var, so each is captured
      # into its own name immediately - the second install() would otherwise
      # silently clobber the first before both are needed below (host Qt for
      # QT_HOST_PATH/cross-build tools, Android Qt for QT_ANDROID_ROOT).
      - name: Install Qt (desktop host kit)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      - name: Capture host Qt path
        run: echo "COUNTDOWN_QT_HOST_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt (Android kit)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          target: android
          arch: android_arm64_v8a

      - name: Capture Android Qt path
        run: echo "COUNTDOWN_QT_ANDROID_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: "4.3.4"
          ninjaVersion: "1.13.2"

      - name: Configure
        env:
          QT_HOST_PATH: ${{ env.COUNTDOWN_QT_HOST_ROOT }}
          QT_ANDROID_ROOT: ${{ env.COUNTDOWN_QT_ANDROID_ROOT }}
        run: >
          cmake --preset android-arm64-v8a-debug
          -DCMAKE_PREFIX_PATH=$QT_ANDROID_ROOT

      - name: Build
        run: cmake --build --preset android-arm64-v8a-debug

  ios-build:
    name: iOS (device, build-only, unsigned)
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt (iOS kit)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          target: ios

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: "4.3.4"
          ninjaVersion: "1.13.2"

      - name: Configure
        run: >
          cmake --preset ios-debug
          -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      # Unsigned build only (see the ios-debug preset's CODE_SIGNING_ALLOWED=NO
      # cache vars) - no Apple Developer certificate is available in this job.
      - name: Build
        run: cmake --build --preset ios-debug

  coverage:
    name: Coverage (Linux, GCC)
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: "4.3.4"
          ninjaVersion: "1.13.2"

      - name: Install GCC 16 (Linux)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-gcc@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      # Qt Quick's offscreen QPA plugin needs libxkbcommon at runtime.
      - name: Install offscreen QPA runtime dependencies
        run: sudo apt-get install -y libxkbcommon0

      - name: Install Qt (prebuilt)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      # The Qt install leaves the newest Python first on PATH, and the pinned
      # lxml has no wheel for it, so pip would build it from source. gcovr runs
      # on a Python that has wheels for what ci/requirements-gcovr.txt pins.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check out the shared scripts
        uses: iainchesworthlabs/icl-common-infra/actions/checkout-infra@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      - name: Install gcovr
        run: pip install --quiet --require-hashes -r ci/requirements-gcovr.txt

      - name: Configure
        run: >
          cmake --preset linux-gcc-coverage
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_CXX_COMPILER=g++-16

      - name: Build
        run: cmake --build --preset linux-gcc-coverage

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset linux-gcc-coverage

      # Line/branch coverage, measured per component (src/lib and src/app) and held to
      # the floors in tools/coverage-floors.json by the shared gate. main.cpp is
      # excluded as a thin, argv-parsing entry point with no own test main; the
      # non-Linux platform implementations are simply never compiled on this runner,
      # so they don't appear in the report.
      - name: Coverage report
        run: >
          gcovr --root . --filter 'src/.*' --exclude 'src/app/main\.cpp'
          --gcov-executable gcov-16
          --exclude-throw-branches --exclude-unreachable-branches
          --gcov-ignore-errors=no_working_dir_found
          --object-directory build/linux-gcc-coverage
          --print-summary --json coverage.json --html-details build/coverage.html

      - name: Coverage gate
        run: >
          python3 .icl-infra/scripts/coverage_gate.py
          --report coverage.json --floors tools/coverage-floors.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            build/coverage*.html
            coverage.json

      - name: Save the vcpkg caches
        if: always()
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/save-vcpkg-cache@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

  ci-status:
    name: CI Status
    if: always()
    needs: [policy, zizmor, plan, build-and-test, translations, toolchain-pins, android-build, ios-build, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate
        uses: iainchesworthlabs/icl-common-infra/actions/ci-status@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {
              "build-and-test": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "android-build": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "ios-build": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "coverage": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
            }
