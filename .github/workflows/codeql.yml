name: CodeQL (C++)

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly scan catches new CodeQL query packs even without code changes.
    - cron: "17 3 * * 1"

# Minimal at workflow level; the analyze job below grants itself the
# security-events/contents access it actually needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: cpp
          build-mode: manual

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "latest"

      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15

      # Sanitizers disabled: CodeQL's build tracer sets its own LD_PRELOAD for
      # the whole build step, which collides with ASan needing to be first in
      # the preload chain. That breaks catch_discover_tests' build-time test
      # listing (it runs the freshly-linked binary to enumerate CTest cases).
      # CodeQL is pure static analysis and gets nothing from ASan/UBSan being
      # enabled here; see docs/building.md for the flag, and
      # linux-gcc-coverage in CMakePresets.json for the same tradeoff made
      # for the same reason (ASan vs. gcov).
      - name: Configure (library + tests only, no Qt app)
        run: >
          cmake --preset linux-gcc-debug
          -DCMAKE_CXX_COMPILER=g++-15
          -DCOUNTDOWN_BUILD_APP=OFF
          -DCOUNTDOWN_ENABLE_SANITIZERS=OFF

      - name: Build
        run: cmake --build --preset linux-gcc-debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:cpp"
