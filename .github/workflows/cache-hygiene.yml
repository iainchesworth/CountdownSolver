name: Cache hygiene

# Keeps the repository's 10 GB Actions cache quota for entries something can
# still restore. GitHub evicts the least recently used entries once the quota is
# exceeded, with no regard for which of them took long to build, and this
# repository's entries are large: the Qt installs are 295 MB (Linux), 324 MB
# (Windows), 1.2 GB (macOS) and 3.4 GB (iOS), and every pull request stores its
# own set, because a cache entry is readable only from its own ref, a pull
# request's base and the default branch - so one open PR alone holds 5.2 GB.
#
# ci/prune-actions-cache.sh holds the rules. It removes the caches of closed
# pull requests and deleted branches (nothing can restore them again) and
# superseded generations. Not a gate: nothing waits for it.

on:
  # A closed pull request's caches go as soon as it is closed (merged or not).
  pull_request:
    types: [closed]
    branches: [main, develop]
  # And a sweep after pushes, for branches deleted without a PR event.
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be deleted.
        type: boolean
        default: true
      purge:
        description: >-
          Delete every entry whose key starts with this, on every ref (for
          example `install-qt-action-mac-`). The next run builds from cold.
        type: string
        default: ""

# Deny-all at the top level; the job grants itself only what it uses.
permissions: {}

# One at a time, never cancelled half way through a delete loop.
concurrency:
  group: cache-hygiene
  cancel-in-progress: false

jobs:
  prune:
    name: Prune Actions caches
    # A fork PR's token cannot delete anything, and a fork's caches are not in
    # this repository's quota in the first place.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write # delete cache entries (gh cache delete)
      contents: read # check out the script
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: ci/prune-actions-cache.sh
          sparse-checkout-cone-mode: false

      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # A manual run defaults to a dry run; every other trigger deletes.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          PURGE: ${{ github.event_name == 'workflow_dispatch' && inputs.purge || '' }}
        run: |
          args=()
          if [ -n "$DRY_RUN" ]; then args+=(--dry-run); fi
          if [ -n "$PURGE" ]; then args+=(--purge "$PURGE"); fi
          bash ci/prune-actions-cache.sh "${args[@]}"
