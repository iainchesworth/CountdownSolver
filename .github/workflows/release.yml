name: Release

# Builds the packages for each platform, signs what it can, and hands them to the shared
# publish workflow, which checks the tag, signs the checksums with GPG, adds an SBOM and
# build provenance, creates the GitHub Release and, for a final release, fast-forwards
# `main`. The steps for the maintainer are in docs/releasing.md.
#
# A tag `vMAJOR.MINOR.PATCH[-suffix]` on a commit of `develop` starts a release.
# `workflow_dispatch` builds and uploads the packages from any branch without publishing,
# to try the packaging (`gh workflow run release.yml --ref <branch>`). The version check
# and the publish job run for tags only. The Android and iOS jobs run in the `release`
# environment, so a run on a branch that would reach the signing secrets waits for approval.
#
# Repository variables (all start as false): SIGN_WINDOWS (false or test; production is
# refused), SIGN_MACOS (false; production is refused), SIGN_IOS_UPLOAD (true builds the
# iOS archive for TestFlight and has Apple validate it; a tag, or a manual run with
# `upload_testflight`, uploads it).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: >-
          Upload the iOS build to TestFlight (a tag always does). Without it a run on a branch only has
          Apple validate the build. Needs SIGN_IOS_UPLOAD=true.
        type: boolean
        default: false

permissions: {}

jobs:
  # The names this run needs, listed before anything is built. The secrets are passed as
  # "set or not": the script never sees a value.
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      android: ${{ steps.check.outputs.android }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the missing names
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          SIGN_WINDOWS: ${{ vars.SIGN_WINDOWS }}
          SIGN_MACOS: ${{ vars.SIGN_MACOS }}
          SIGN_IOS_UPLOAD: ${{ vars.SIGN_IOS_UPLOAD }}
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY != '' }}
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE != '' }}
          RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID != '' }}
          RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD != '' }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID != '' }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID != '' }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' }}
          WIN_TESTSIGN_PFX_BASE64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 != '' }}
          WIN_TESTSIGN_PFX_PASSWORD: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD != '' }}
        run: python3 tools/ci/release_preflight.py

  version:
    name: Check the version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag with the project version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ci/check_release_version.py "$TAG"

      - name: Work out the version
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Check the release has notes
        uses: iainchesworthlabs/icl-common-infra/actions/release-notes@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          version: ${{ steps.tag.outputs.version }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          output-file: ${{ runner.temp }}/notes.md

  package:
    name: Package (${{ matrix.name }})
    needs: [preflight, version]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            preset: linux-gcc-release
            cxx: g++-16
          - name: macos
            os: macos-26
            preset: macos-clang-release
          - name: windows
            os: windows-2025-vs2026
            preset: windows-msvc-release

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The vcpkg caches are restored here and never saved: only ci.yml saves them,
      # so nothing this workflow does, which builds what gets attested and
      # released, can end up in a cache the other workflows trust. The release
      # configure builds no tests, so vcpkg has little to build anyway.
      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: "4.3.4"
          ninjaVersion: "1.13.2"

      # The package is built on the 24.04 image so the binaries keep that
      # image's glibc as their floor; GCC 16 comes from the toolchain PPA there.
      - name: Install GCC 16 (Linux)
        if: runner.os == 'Linux'
        uses: iainchesworthlabs/icl-common-infra/actions/setup-gcc@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      # rpmbuild isn't preinstalled on the Ubuntu runner; without it CPack
      # silently skips the RPM generator (see packaging/linux/Packaging.cmake)
      # and we'd only notice by the .rpm being missing from the release. The
      # other tools are the ones packaging/linux/check-package.sh uses.
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y rpm fakeroot desktop-file-utils appstream

      # makensis has to be on PATH at configure time: cmake/Packaging.cmake adds the
      # installer only when it finds it, and the Windows image no longer ships it.
      # Chocolatey's feed answers 504 now and then, so the install is retried.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($attempt in 1..4) {
            choco install nsis --version 3.13.0 --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { throw "choco install nsis failed four times" }
            Write-Warning "choco install nsis failed (attempt $attempt of 4)"
            Start-Sleep -Seconds (15 * $attempt)
          }
          Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\NSIS"

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: iainchesworthlabs/icl-common-infra/actions/setup-msvc-env@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      - name: Install Qt (prebuilt)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      # What follows the dash in the tag (v0.3.0-beta.5 gives beta.5), empty for
      # a final release or a run that is not on a tag. The Linux packages use it
      # to sort a pre-release before the release it leads up to.
      - name: Work out the pre-release suffix
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          prerelease=""
          if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" == v*-* ]]; then
            prerelease="${REF_NAME#*-}"
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # See ci.yml's Configure step for why matrix values go through env:
      # rather than straight into run:, and why shell: bash is explicit here.
      - name: Configure
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          BUILD_NUMBER: ${{ github.run_number }}
          EXTRA_CXX_COMPILER: ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}
        run: >
          cmake --preset "$CMAKE_PRESET"
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCOUNTDOWN_BUILD_TESTS=OFF
          -DCOUNTDOWN_VERSION_PRERELEASE="$PRERELEASE"
          -DCOUNTDOWN_BUILD_NUMBER="$BUILD_NUMBER"
          $EXTRA_CXX_COMPILER

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The program, signed before CPack copies it into the installer and the archive. With
      # SIGN_WINDOWS=false nothing is signed and the step only reports the "-unsigned" name
      # that the packages get.
      - name: Sign the program (Windows)
        id: sign_app
        if: runner.os == 'Windows'
        uses: iainchesworthlabs/icl-common-infra/actions/sign-windows@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          mode: ${{ vars.SIGN_WINDOWS || 'false' }}
          files: build/${{ matrix.preset }}/bin/countdownsolver.exe
          rename: "false"
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      - name: Package (CPack)
        working-directory: build/${{ matrix.preset }}
        run: cpack

      # Every platform carries its own Qt (packaging/linux/InstallApp.cmake on
      # Linux), so the Linux packages depend only on the system libraries Qt's
      # xcb and OpenGL plumbing loads. Installing the .deb has apt install exactly
      # those, which also shows they can be had on the oldest system the package is
      # for, and gives the checks below a machine that has what the package links.
      - name: Install the .deb (Linux)
        if: runner.os == 'Linux'
        working-directory: build/${{ matrix.preset }}
        shell: bash
        run: sudo apt-get install -y xvfb ./CountdownSolver-*-Linux.deb

      - name: Check the Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/linux/check-package.sh build/${{ matrix.preset }}

      # The floor of the package: it has to start on Ubuntu 24.04 and Debian 13
      # (glibc 2.39, GCC 14's libstdc++). It is built on the 24.04 runner, so the
      # glibc is that system's, but the symbols are read directly all the same.
      - name: Unpack the .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: dpkg-deb -x build/${{ matrix.preset }}/CountdownSolver-*-Linux.deb "$RUNNER_TEMP/deb"

      - name: Check the glibc the package needs (Linux)
        if: runner.os == 'Linux'
        uses: iainchesworthlabs/icl-common-infra/actions/check-glibc-floor@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          folder: ${{ runner.temp }}/deb

      - name: Check the libstdc++ the package needs (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/linux/check-libstdcxx-floor.sh "$RUNNER_TEMP/deb"

      # Still running after ten seconds is a start; a crash or a missing library
      # ends the program sooner. The software renderer keeps this independent of
      # the runner's graphics.
      - name: Start the installed program (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QUICK_BACKEND: software
        run: |
          status=0
          timeout 10 xvfb-run -a countdownsolver || status=$?
          if [ "$status" -ne 124 ]; then
            echo "::error::the installed program ended with status $status within ten seconds" >&2
            exit 1
          fi

      # The installer is signed (SIGN_WINDOWS=test) or renamed NAME-unsigned.exe, and the
      # archive gets the same suffix, so a package says what it is.
      - name: Find the installer (Windows)
        id: installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          installer="$(ls build/${{ matrix.preset }}/CountdownSolver-*-win64.exe | head -n 1)"
          echo "path=$installer" >> "$GITHUB_OUTPUT"

      - name: Sign the installer (Windows)
        if: runner.os == 'Windows'
        uses: iainchesworthlabs/icl-common-infra/actions/sign-windows@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          mode: ${{ vars.SIGN_WINDOWS || 'false' }}
          files: ${{ steps.installer.outputs.path }}
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      - name: Name the archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          SUFFIX: ${{ steps.sign_app.outputs.suffix }}
        run: |
          set -euo pipefail
          for f in build/${{ matrix.preset }}/CountdownSolver-*-win64.zip; do
            mv "$f" "${f%.zip}${SUFFIX}.zip"
          done

      # No macOS signing is configured (SIGN_MACOS is false, and the preflight refuses
      # production), so the packages say so.
      - name: Name the packages (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for f in build/${{ matrix.preset }}/CountdownSolver-*-Darwin.dmg build/${{ matrix.preset }}/CountdownSolver-*-Darwin.zip; do
            mv "$f" "${f%.*}-unsigned.${f##*.}"
          done

      # Only these extensions are ever produced (see cmake/Packaging.cmake and
      # packaging/linux/Packaging.cmake). The shared publish workflow makes the
      # checksums, signatures, SBOM and attestations from what this step uploads.
      - name: Collect the packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          files=(build/${{ matrix.preset }}/*.zip build/${{ matrix.preset }}/*.tar.gz build/${{ matrix.preset }}/*.deb build/${{ matrix.preset }}/*.rpm build/${{ matrix.preset }}/*.exe build/${{ matrix.preset }}/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No package files found. Did CPack run?" >&2
            exit 1
          fi
          cp "${files[@]}" dist/
          ls -l dist

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  android-release:
    name: Package (Android arm64-v8a, signed)
    needs: [preflight, version]
    # Skipped, not failed, until the four ANDROID_* secrets exist (the preflight job says
    # which are missing). The job runs in the release environment, so the maintainer
    # approves it before it reaches the signing key.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped') && needs.preflight.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android NDK, platform and build-tools
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Qt (desktop host kit)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      - name: Capture host Qt path
        run: echo "COUNTDOWN_QT_HOST_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt (Android kit)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          target: android
          arch: android_arm64_v8a

      - name: Capture Android Qt path
        run: echo "COUNTDOWN_QT_ANDROID_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: "4.3.4"
          ninjaVersion: "1.13.2"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Configure
        env:
          QT_HOST_PATH: ${{ env.COUNTDOWN_QT_HOST_ROOT }}
          QT_ANDROID_ROOT: ${{ env.COUNTDOWN_QT_ANDROID_ROOT }}
        run: >
          cmake --preset android-arm64-v8a-release
          -DCMAKE_PREFIX_PATH=$QT_ANDROID_ROOT

      - name: Build
        run: cmake --build --preset android-arm64-v8a-release

      # androiddeployqt is a host build tool (it drives Gradle on the CI
      # runner) shipped in the desktop Qt kit's bin/, not the Android target
      # kit - confirmed against a real Qt 6.8.3 install ("No such file or
      # directory" against COUNTDOWN_QT_ANDROID_ROOT on a real CI run; it
      # exists at COUNTDOWN_QT_HOST_ROOT/bin/androiddeployqt(6) instead).
      # androiddeployqt's own --sign flag is its documented signing mechanism
      # (keystore + alias + store/key passwords), so no custom Gradle
      # signingConfig override is needed.
      # CMake mirrors the source tree under the build dir, and
      # qt_add_executable(countdownsolver ...) is called from
      # src/app/CMakeLists.txt, so the deployment-settings JSON (and the
      # unsigned android-build/ androiddeployqt already produced once,
      # automatically, as part of the plain "Build" step above) both land
      # under src/app/, not the build root - confirmed on a real CI run
      # ("Cannot read from input file" without the src/app/ prefix).
      - name: Sign and package APK + AAB
        working-directory: build/android-arm64-v8a-release/src/app
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "$COUNTDOWN_QT_HOST_ROOT/bin/androiddeployqt" \
            --input android-countdownsolver-deployment-settings.json \
            --output android-build \
            --release --gradle \
            --sign "${{ runner.temp }}/release.keystore" "$ANDROID_KEY_ALIAS" \
            --storepass "$ANDROID_KEYSTORE_PASSWORD" \
            --keypass "$ANDROID_KEY_PASSWORD"
          "$COUNTDOWN_QT_HOST_ROOT/bin/androiddeployqt" \
            --input android-countdownsolver-deployment-settings.json \
            --output android-build \
            --release --gradle --aab \
            --sign "${{ runner.temp }}/release.keystore" "$ANDROID_KEY_ALIAS" \
            --storepass "$ANDROID_KEYSTORE_PASSWORD" \
            --keypass "$ANDROID_KEY_PASSWORD"
          # android-build/ contains BOTH android-build-release-unsigned.apk
          # (Qt's own automatic unsigned build, produced during the plain
          # "Build" step above, before this step even runs) and
          # android-build-release-signed.apk (this step's own --sign output)
          # side by side in the same output directory - a bare "*.apk" glob
          # matches both, and since -exec cp runs once per match with no
          # defined match order, it can silently overwrite the signed APK
          # with the unsigned one depending on filesystem traversal order.
          # Confirmed on a real release run: the final artifact was
          # genuinely unsigned (apksigner: "Missing META-INF/MANIFEST.MF")
          # despite CI reporting success, because file-existence/checksum
          # checks alone don't catch this. Match only the signed file by
          # name to fix the root cause, and verify it explicitly below so
          # this class of bug can't silently ship again undetected.
          mkdir -p ../../../../dist-android
          find android-build -name "*-signed.apk" -exec cp {} ../../../../dist-android/CountdownSolver-android-arm64-v8a.apk \;
          find android-build -name "*.aab" -exec cp {} ../../../../dist-android/CountdownSolver-android-arm64-v8a.aab \;

      - name: Verify the APK is actually signed
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under \$ANDROID_HOME/build-tools" >&2
            exit 1
          fi
          if ! "$apksigner" verify --verbose dist-android/CountdownSolver-android-arm64-v8a.apk; then
            echo "::error::Signed APK failed apksigner verification - see docs/ci.md for the known unsigned/signed glob-collision root cause this guards against" >&2
            exit 1
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: |
            dist-android/*.apk
            dist-android/*.aab
          if-no-files-found: error

  # The iOS archive for TestFlight. Off until SIGN_IOS_UPLOAD is true, which needs the
  # Apple secrets and the App Store profile (docs/releasing.md). On a branch, Apple only
  # validates the build; a tag, or a manual run with `upload_testflight`, uploads it.
  # Testers install it from the TestFlight app. The job runs in the release environment.
  ios:
    name: Package (iOS)
    needs: [preflight, version]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped') && vars.SIGN_IOS_UPLOAD == 'true' }}
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The identifier is set once, in CMakeLists.txt.
      - name: Read the application identifier
        id: ident
        shell: bash
        run: |
          set -euo pipefail
          id="$(sed -n 's/^set(COUNTDOWN_APPLICATION_ID "\(.*\)")$/\1/p' CMakeLists.txt)"
          [ -n "$id" ] || { echo "::error::CMakeLists.txt does not set COUNTDOWN_APPLICATION_ID"; exit 1; }
          echo "bundle-id=$id" >> "$GITHUB_OUTPUT"

      # The shared action names the secret that is missing, before a Qt download of several gigabytes.
      - name: Import the certificate and the provisioning profile
        id: signing
        uses: iainchesworthlabs/icl-common-infra/actions/import-ios-signing@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          certificate-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          certificate-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          bundle-id: ${{ steps.ident.outputs.bundle-id }}
          method: app-store

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: "4.3.4"
          ninjaVersion: "1.13.2"

      - name: Install Qt (iOS kit)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          target: ios

      # Signed for the application alone (src/app/CMakeLists.txt says why). CMake makes no
      # Xcode scheme unless asked, and `xcodebuild archive` takes only a scheme.
      - name: Configure (signed)
        shell: bash
        env:
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: >
          cmake --preset ios-release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_XCODE_GENERATE_SCHEME=ON
          -DCOUNTDOWN_BUILD_NUMBER="$BUILD_NUMBER"
          -DCOUNTDOWN_IOS_SIGNING_TEAM="$TEAM_ID"
          -DCOUNTDOWN_IOS_SIGNING_PROFILE="$PROFILE_NAME"

      - name: Name the package
        id: name
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          label=dry-run
          if [ "$REF_TYPE" = tag ]; then label="$REF_NAME"; fi
          project="$(find build/ios-release -maxdepth 1 -name '*.xcodeproj' | head -n 1)"
          [ -n "$project" ] || { echo "::error::CMake made no .xcodeproj under build/ios-release"; exit 1; }
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "ipa=dist-ios/CountdownSolver-$label-ios-appstore.ipa" >> "$GITHUB_OUTPUT"
          echo "version=${label#v}" >> "$GITHUB_OUTPUT"

      - name: Archive and export the IPA
        id: export
        uses: iainchesworthlabs/icl-common-infra/actions/export-ios-ipa@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          project: ${{ steps.name.outputs.project }}
          scheme: countdownsolver
          bundle-id: ${{ steps.ident.outputs.bundle-id }}
          team-id: ${{ steps.signing.outputs.team-id }}
          profile-name: ${{ steps.signing.outputs.profile-name }}
          method: app-store
          output: ${{ steps.name.outputs.ipa }}

      # The signed IPA, opened as a device would: identifier, version, the icon, no permission
      # text, arm64, a valid signature and an App Store profile for this identifier.
      - name: Check the IPA
        shell: bash
        env:
          IPA: ${{ steps.export.outputs.ipa }}
          VERSION: ${{ steps.name.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          args=(--signed --store)
          if [ "$REF_TYPE" = tag ]; then args+=(--version "${VERSION%%-*}"); fi
          packaging/ios/verify_app.sh "$IPA" "${args[@]}"

      # Apple's own check of the icon, the property list, the signature and the privacy
      # declarations; and, for a tag or a manual run that asks, the upload to TestFlight.
      - name: Validate with Apple, and upload to TestFlight
        uses: iainchesworthlabs/icl-common-infra/actions/upload-testflight@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          ipa: ${{ steps.export.outputs.ipa }}
          key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          validate-only: ${{ github.ref_type != 'tag' && inputs.upload_testflight != true }}

      - name: Remove the signing keychain and profile
        if: always()
        uses: iainchesworthlabs/icl-common-infra/actions/import-ios-signing@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          remove: "true"

      # Not named release-*: an IPA is for TestFlight, not for the release page.
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-appstore
          retention-days: 7
          path: dist-ios/*
          if-no-files-found: error

      - name: Say what happened
        shell: bash
        env:
          UPLOADED: ${{ github.ref_type == 'tag' || inputs.upload_testflight == true }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          {
            echo "### iOS build for TestFlight"
            if [ "$UPLOADED" = true ]; then
              echo "Uploaded as build $BUILD_NUMBER. Apple processes it for a few minutes; then it is in the TestFlight app for the internal testers."
            else
              echo "Validated by Apple, not uploaded. Run the workflow with \`upload_testflight\` (or push a tag) to upload build $BUILD_NUMBER."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: [package, android-release, ios]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.package.result == 'success' && (needs.android-release.result == 'success' || needs.android-release.result == 'skipped') && (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/release-publish.yml@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
    secrets:
      REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
      REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
